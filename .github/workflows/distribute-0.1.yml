name: distribute-0.1

on:
  push:
    tags:
      - '0.1.*' # secrets are tied to version 0.1
  workflow_dispatch: # allow manual triggering from GitHub page

jobs:
  distribute:
    # The secrets created by `./dk0 prepare-version --ci github 0.1` are tied to
    # this environment only.
    environment: dk-distribution

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in the manylinux glibc 2.28 container, the dk0 Linux
          # toolchain contract and the same image as CommonsBase_Dk's dk1 legs.
          - runs-on: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.04.08-5
            distscript: dist/Linux_x86_64.u
            target-abi: Linux_x86_64
          # Pass BOTH ABIs on a cross leg, as CommonsBase_Dk does.
          - runs-on: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.04.08-5
            distscript: dist/Linux_x86.u
            execution-abi: Linux_x86_64
            target-abi: Linux_x86
          - runs-on: macos-latest
            distscript: dist/Darwin_arm64.u
            execution-abi: Darwin_arm64
            target-abi: Darwin_arm64
          - runs-on: macos-latest
            distscript: dist/Darwin_x86_64.u
            execution-abi: Darwin_arm64
            target-abi: Darwin_x86_64
          - runs-on: windows-latest
            distscript: dist/Windows_x86_64.u
            target-abi: Windows_x86_64
          - runs-on: windows-latest
            distscript: dist/Windows_x86.u
            execution-abi: Windows_x86_64
            target-abi: Windows_x86

    runs-on: ${{ matrix.runs-on }}
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with: { egress-policy: audit }
      - name: Checkout repository
        uses: actions/checkout@v6

      # gcc -m32 for ring's C and assembly, and the i686 C runtime for the final
      # link of the fixture. The same packages CommonsBase_Dk's dk1 Linux_x86 leg
      # installs.
      - name: Prepare Linux_x86 multilib toolchain
        if: ${{ matrix.distscript == 'dist/Linux_x86.u' }}
        run: |
          dnf upgrade -y libstdc++
          dnf install -y glibc-devel.i686 libgcc.i686 libstdc++.i686 gcc-toolset-14-libstdc++-devel.i686

      - name: Distribute Modules
        uses: diskuv/dk-distribute@v4
        with:
          pubkey: ${{ secrets.distribute_0_1_pubkey }}
          seckey: ${{ secrets.distribute_0_1_seckey }}
          options: -nosysinc
          # A cross leg (execution-abi != target-abi) never restores the release
          # store, as in CommonsBase_Dk.
          store: none
          distscript: ${{ matrix.distscript }}
          execution-abi: ${{ matrix.execution-abi }}
          target-abi: ${{ matrix.target-abi }}
          experimental-mlfront-ref: ${{ github.ref_type != 'tag' && 'HEAD' }}

  combine:
    needs: distribute
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with: { egress-policy: audit }
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Combine Modules
        uses: diskuv/dk-distribute/combine@v4

      # Attests the distribution, publishes the sigstore bundle for values.json
      # as a release asset, and creates the release.
      - name: Attest and Release
        uses: diskuv/dk-distribute/attest-release@v4
